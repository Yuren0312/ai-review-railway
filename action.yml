name: "AI Review Railway — the railway-metallurgy layer"
description: >-
  Lightweight pre-review and capacity protection for PRs generated by AI agents:
  detection, rate limiting, risk classification, human guarantors, sandbox
  allow-listing, and metrics. Defaults to observe mode; never checks out or
  executes PR code.
branding:
  icon: "shield"
  color: "green"
inputs:
  config_path:
    description: "Path to the config file (YAML subset, zero dependencies)"
    required: false
    default: ".ai-review-railway.yml"
  token:
    description: "GitHub Token (leave empty to use the GITHUB_TOKEN environment variable)"
    required: false
    default: ""
  mode:
    description: "Override the mode from config: observe | enforce"
    required: false
outputs:
  is_ai:
    description: "Whether the PR was flagged as AI-generated (true/false)"
  risk_level:
    description: "Risk level: low | medium | high"
  rate_limited:
    description: "Whether rate limiting was triggered (true/false)"
  guarantor_required:
    description: "Whether a human guarantor is required (true/false)"
  guarantor_satisfied:
    description: "Whether the guarantor is in place (true/false)"
  sandbox_allowed:
    description: "Whether the PR passed the sandbox allow-list (true/false)"
  metrics_json:
    description: "Metrics JSON for this pre-review (string)"
runs:
  using: "node20"
  main: "dist/index.js"
