# ai-review-railway · default config
# Copy this to your repo root and adjust as needed. This file doubles as the
# reference example of the "zero-dependency YAML subset".

enabled: true
mode: observe            # observe | enforce (observe = comment+label only; enforce = additionally flags blockers, but never closes)

limits:
  per_agent_per_day: 3   # max PRs per AI agent per day
  per_repo_per_day: 10   # max PRs per repo per day
  max_files: 20          # file-count threshold for a single PR
  max_additions: 500     # additions threshold for a single PR

risk:
  high_paths:
    - ".github/workflows/**"
    - "package.json"
    - "requirements.txt"
    - "pyproject.toml"
    - "**/auth/**"
  require_tests_for: [medium, high]

guarantor:
  required_for: [medium, high]
  approved_label: "ai-guarantor-approved"

sandbox:
  allow_repos: []                # empty = no repo restriction
  allow_branches: ["ai-sandbox/*"]   # trial-run only on these branches

review:
  comment: true
  checklist: true
  metrics: true
