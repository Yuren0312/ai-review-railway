name: AI Review Railway

# Use pull_request_target: runs in the trusted base-branch context, and does not
# checkout PR code by default.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read

jobs:
  railway:
    runs-on: ubuntu-latest
    steps:
      # NOTE: we deliberately do NOT run actions/checkout here. The action reads
      # everything through the API, so code from PRs (especially forks) is never
      # checked out or executed.
      - name: AI Review Railway (pre-review + capacity protection)
        uses: Yuren0312/ai-review-railway@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config_path: .ai-review-railway.yml

  # Optional: monthly capacity report (triggered manually via workflow_dispatch).
