# Advanced config example: a complete setup that trial-runs in a sandbox,
# requires a guarantor for medium/high risk, and records metrics.
# Copy as .ai-review-railway.yml to use.

enabled: true
mode: observe            # start with observe; consider enforce once stable

limits:
  per_agent_per_day: 3
  per_repo_per_day: 15
  per_author_per_hour: 5   # optional: hourly limit
  max_files: 30
  max_additions: 800
  max_deletions: 400

risk:
  high_paths:
    - ".github/workflows/**"
    - "package.json"
    - "package-lock.json"
    - "requirements*.txt"
    - "pyproject.toml"
    - "go.mod"
    - "Cargo.toml"
    - "**/auth/**"
    - "**/credentials*"
  medium_paths:
    - "src/core/**"
    - "internal/**"
  require_tests_for: [medium, high]

ai:
  labels: [ai, ai-generated, bot, copilot, claude, gpt, openai, automated]
  authors: ["ci-bot"]
  keywords: ["generated by", "ai-generated", "automatically generated"]

guarantor:
  required_for: [medium, high]
  approved_label: "ai-guarantor-approved"
  command: "/guarantee"

sandbox:
  allow_repos: ["your-org/your-repo"]   # only this repo is in scope
  allow_branches: ["ai-sandbox/*"]
  allow_paths: []
  enforce: true                         # block non-allow-listed branches

review:
  comment: true
  checklist: true
  metrics: true
