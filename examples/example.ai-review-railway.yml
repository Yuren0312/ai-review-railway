# 进阶配置示例：一个「先 sandbox 试跑、中高风险强制担保、记录度量」的完整配置
# 复制为 .ai-review-railway.yml 使用

enabled: true
mode: observe            # 先 observe，稳定后再考虑 enforce

limits:
  per_agent_per_day: 3
  per_repo_per_day: 15
  per_author_per_hour: 5   # 可选：每小时限制
  max_files: 30
  max_additions: 800
  max_deletions: 400

risk:
  high_paths:
    - ".github/workflows/**"
    - "package.json"
    - "package-lock.json"
    - "requirements*.txt"
    - "pyproject.toml"
    - "go.mod"
    - "Cargo.toml"
    - "**/auth/**"
    - "**/credentials*"
  medium_paths:
    - "src/core/**"
    - "internal/**"
  require_tests_for: [medium, high]

ai:
  labels: [ai, ai-generated, bot, copilot, claude, gpt, openai, automated]
  authors: ["ci-bot"]
  keywords: ["generated by", "ai-generated", "automatically generated", "由 AI 生成"]

guarantor:
  required_for: [medium, high]
  approved_label: "ai-guarantor-approved"
  command: "/guarantee"

sandbox:
  allow_repos: ["your-org/your-repo"]   # 仅此仓库生效
  allow_branches: ["ai-sandbox/*"]
  allow_paths: []
  enforce: true                         # 非白名单分支直接阻断

review:
  comment: true
  checklist: true
  metrics: true
